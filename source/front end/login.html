<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./font-awesome/css/font-awesome.min.css">

    <title>Login</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
    }
    body{
        background-color: #faedbb;
    }
    .content{
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        overflow: hidden;
        }
    
    .introduce{
        width: 50%;
        height: 100%;
        position: relative;
        background-color:#716892;
        /* background: linear-gradient(to right, #716892, #faedbb); */
        text-align: center;
    
    }
    .login-form{
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        margin-left: 10vw;
    }
    .tips{
        margin-top: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        transform: translateY(-50%);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 25px;
    }
    .other-login{
        width: 100%;
        height: 50px;
        line-height: 50px;
        border: 1px solid #fff;
        text-align: center;
        border-radius: 10px;
        box-sizing: border-box;
        margin: 50px 0 10px 0;
        cursor: pointer;
        transition: .2s;
    }
    
    span{
        vertical-align: middle;
        color: black;
    }
    .input-wrapper{
        width: 100%;
        height: 60px;
        color:#716892;
        margin: 20px 0px 50px 0;
    }
    .ipt{
        width:100%;
        height:100%;
        border-radius: 10px;
        border: 1px solid #fff;
        padding: 10px 0 10px 30px;
        box-sizing: border-box;
        background-color: transparent;
        outline: none;
        color: #716892;
    }
    .ipt:focus , .other-login:hover{
        border: 1px solid #9faff8;
    }
    .other-setting{
        display: flex;
        justify-content: space-between;
    }
    .rem-pwd{
        cursor: pointer;
    }
    .forget-pwd{
        cursor: pointer;
    }
    .btn{
        width: 100%;
        height: 50px;
        border: 0;
        background-color: #fff;
        border-radius: 5px;
        color: #000;
        text-align: center;
        cursor: pointer;
        font-size: 20px;
        transition: .2s;
    }
    .register{
        color: #fff;
        cursor: pointer;    
    }
    @media (max-width: 768px){
        .introduce{
        display: none;
    }
        .form-wrapper{
        width: 80%;
        }
    }
    </style>
<body>
<p style="position:fixed;top:0;left:0;right:0;padding:12px;background:#fff4cb;z-index:10000;text-align:center">Teaching prototype only · demo@example.com / demo-only · Do not enter a real password. <a href="index.html">Skip login →</a></p>
    <div class="content">
        <div class="introduce">
            <div class="introduce-content">
                <h1 id="sentence" class="tips"></h1>
            </div>
        </div>
        <div class="form-wrapper">
            <div class="login-form">
                <h1>Login</h1>
                <span class="login-tips">
                    Measure the performance
                </span>
                <div class="other-login">
                    <i class="fa fa-facebook-official" aria-hidden="true"></i>
                    <span class="line"></span>
                    <a href="https://www.facebook.com/home.php" style="text-decoration: none;"><span class="divider-text"> Login With Facebook</span></a>
                    <span class="line"></span>
                </div>
                <div class="form">
                    <div class="input-wrapper">
                        <span class="input-tips">Email</span>
                        <input type="text" class="ipt" placeholder="demo@example.com">
                    </div>

                    <div class="input-wrapper">
                        <span class="input-tips">Password</span>
                        <input type="password" class="ipt" placeholder="">
                    </div>
                    <div class="other-setting">
                        <div class="rem-pwd">
                            <input type="checkbox">
                            <span>Remember me</span>
                        </div>
                        <span class="forget-pwd">Forget Password</span>
                    </div>
                    <button class="btn" onclick="validateUserCredentials()">Login</button>
                </div>
                <span class="register">Not register yet? Create an Account?</span>
            </div>
        </div>
    </div>
    <script src="./javascript/motivational quotes.js"></script>
    <script src="./javascript/login_script.js"></script>
</body>
</html>
